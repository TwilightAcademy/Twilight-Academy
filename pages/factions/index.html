<!DOCTYPE html>
<html lang="zh-Hans">
<head>

<body data-base="../.." data-page="factions">
  <article class="sheet sheet--wide">
    <p class="sheet__home"><a href="../../index.html" data-bind="name">黄昏学院</a></p>

      <div class="faction-slot">
        <a class="faction-card faction-card--academy" href="黄昏学院/index.html">

            <span class="faction-card__title" data-bind="factions.items.0.title">黄昏学院</span>

          <span class="faction-card__badge">
            <img src="../../images/background/SCHOOL_ICON.webp" alt="">
          </span>
        </a>
      </div>
      <div class="faction-slot">
        <a class="faction-card" href="2/index.html">
          <div class="faction-card__panel">
            <span class="faction-card__title" data-bind="factions.items.1.title">待填入</span>

          </div>
          <span class="faction-card__badge">
            <span class="faction-card__mark" data-bind="factions.items.1.mark">02</span>
          </span>
        </a>
      </div>
      <div class="faction-slot">
        <a class="faction-card" href="3/index.html">
          <div class="faction-card__panel">
            <span class="faction-card__title" data-bind="factions.items.2.title">待填入</span>
            <p class="faction-card__copy" data-bind="factions.items.2.summary">待填入</p>
            <span class="faction-card__more" data-bind="ui.detail">详情</span>
          </div>
          <span class="faction-card__badge">
            <span class="faction-card__mark" data-bind="factions.items.2.mark">03</span>
          </span>
        </a>
      </div>
    </nav>
    <p class="sheet__back"><a href="../../index.html" data-bind="ui.backHome">返回首页</a></p>

  <script src="../../content/site.js"></script>
